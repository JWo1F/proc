[package]
name = "procfile"
version = "1.9.1"
edition = "2024"
description = "A process manager that runs commands defined in a Procfile"

[dependencies]
tokio = { version = "1.44.2", features = ["macros", "process", "rt", "io-util", "signal", "sync", "time"] }
colored = "3.0.0"
pty-process = { version = "0.5.1", features = ["async"] }
nix = { version = "0.30.1", features = ["signal"] }
clap = { version = "4.5.37", features = ["derive"] }
chrono = "0.4.41"
axum = { version = "0.8", features = ["tokio"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[features]
default = ["web"]
web = ["dep:axum", "dep:tokio-stream", "dep:rust-embed", "dep:mime_guess"]
