[package]
name = "procfile"
version = "2.9.0"
edition = "2024"
rust-version = "1.94"
description = "A process manager that runs commands defined in a Procfile"

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "process", "rt", "io-util", "io-std", "signal", "sync", "time"] }
colored = "3.1.1"
pty-process = { version = "0.5.3", features = ["async"] }
nix = { version = "0.31.3", features = ["signal"] }
clap = { version = "4.6.6", features = ["derive"] }
chrono = "0.4.45"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
axum = { version = "0.8", features = ["tokio"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tower-http = { version = "0.7", features = ["set-header"], optional = true }

[features]
default = ["web"]
web = ["dep:axum", "dep:tokio-stream", "dep:tower-http"]
