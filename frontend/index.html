<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>procfile</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Crect x='5' y='7' width='16' height='3.5' rx='1.75' fill='%23f472b6'/%3E%3Crect x='5' y='14.25' width='22' height='3.5' rx='1.75' fill='%2334d399'/%3E%3Crect x='5' y='21.5' width='12' height='3.5' rx='1.75' fill='%2360a5fa'/%3E%3C/svg%3E"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body
        class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 h-screen flex flex-col overflow-hidden transition-colors duration-200"
    >
        <!-- Header -->
        <header
            class="flex-none border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-4 py-3"
        >
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <svg
                        class="w-7 h-7 flex-none"
                        viewBox="0 0 32 32"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <rect width="32" height="32" rx="8" fill="#0f172a" />
                        <rect
                            x="5"
                            y="7"
                            width="16"
                            height="3.5"
                            rx="1.75"
                            fill="#f472b6"
                        />
                        <rect
                            x="5"
                            y="14.25"
                            width="22"
                            height="3.5"
                            rx="1.75"
                            fill="#34d399"
                        />
                        <rect
                            x="5"
                            y="21.5"
                            width="12"
                            height="3.5"
                            rx="1.75"
                            fill="#60a5fa"
                        />
                    </svg>
                    <h1
                        id="app-title"
                        class="text-lg font-semibold tracking-tight"
                    >
                        procfile
                    </h1>
                    <div
                        id="status-badge"
                        class="flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400"
                    >
                        <span
                            class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"
                        ></span>
                        <span>connected</span>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <!-- Search -->
                    <div
                        class="flex items-stretch rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus-within:ring-2 focus-within:ring-blue-500 dark:focus-within:ring-blue-400 focus-within:border-transparent"
                        id="search-bar"
                    >
                        <div class="relative flex-1">
                            <svg
                                class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 dark:text-gray-500 pointer-events-none"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                                />
                            </svg>
                            <input
                                id="search-input"
                                type="text"
                                placeholder="Search logs..."
                                class="font-mono w-64 h-full pl-8 pr-8 py-1.5 text-sm bg-transparent border-none focus:outline-none placeholder-gray-400 dark:placeholder-gray-500"
                            />
                            <button
                                id="search-clear"
                                class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hidden"
                                title="Clear search"
                            >
                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"
                                    />
                                </svg>
                            </button>
                        </div>
                        <div
                            class="flex items-center border-l border-gray-300 dark:border-gray-700"
                        >
                            <button
                                id="search-case-btn"
                                class="px-2 h-full text-xs font-bold text-gray-400 dark:text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors leading-none"
                                title="Match case"
                            >
                                Aa
                            </button>
                            <button
                                id="search-word-btn"
                                class="px-2 h-full text-xs font-bold text-gray-400 dark:text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors leading-none border-l border-gray-300 dark:border-gray-700"
                                title="Match whole word"
                            >
                                W
                            </button>
                            <button
                                id="search-regex-btn"
                                class="px-2 h-full text-xs font-bold text-gray-400 dark:text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors leading-none border-l border-gray-300 dark:border-gray-700"
                                title="Use regular expression"
                            >
                                .*
                            </button>
                        </div>
                    </div>
                    <!-- Regex error -->
                    <span
                        id="search-error"
                        class="text-xs text-red-500 dark:text-red-400 hidden max-w-[12rem] truncate"
                        title=""
                    ></span>

                    <!-- Filter count -->
                    <span
                        id="filter-count"
                        class="text-xs text-gray-500 dark:text-gray-400 hidden min-w-[4rem]"
                    ></span>

                    <!-- Process filter -->
                    <div class="relative" id="process-filter-container">
                        <button
                            id="process-filter-btn"
                            class="flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                        >
                            <svg
                                class="w-4 h-4 text-gray-500"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
                                />
                            </svg>
                            <span>Processes</span>
                        </button>
                        <div
                            id="process-filter-dropdown"
                            class="hidden absolute right-0 top-full mt-1 w-48 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg z-50 py-1"
                        ></div>
                    </div>

                    <!-- Level filter -->
                    <div class="relative" id="level-filter-container">
                        <button
                            id="level-filter-btn"
                            class="flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                        >
                            <svg
                                class="w-4 h-4 text-gray-500"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                                />
                            </svg>
                            <span>Levels</span>
                        </button>
                        <div
                            id="level-filter-dropdown"
                            class="hidden absolute right-0 top-full mt-1 w-40 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg z-50 py-1"
                        ></div>
                    </div>

                    <!-- Download -->
                    <div class="relative" id="download-container">
                        <button
                            id="download-btn"
                            class="flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                            title="Download logs"
                        >
                            <svg
                                class="w-4 h-4 text-gray-500"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                                />
                            </svg>
                            <span>Save</span>
                        </button>
                        <div
                            id="download-dropdown"
                            class="hidden absolute right-0 top-full mt-1 w-56 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg z-50 py-1"
                        >
                            <button
                                id="download-all"
                                class="w-full text-left px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                            >
                                Download all logs
                            </button>
                            <button
                                id="download-filtered"
                                class="w-full text-left px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors hidden"
                            >
                                Download filtered logs
                            </button>
                        </div>
                    </div>

                    <!-- Theme toggle -->
                    <button
                        id="theme-toggle"
                        class="p-1.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                        title="Toggle theme"
                    >
                        <svg
                            id="theme-icon-light"
                            class="w-4 h-4 text-gray-500 hidden"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                            />
                        </svg>
                        <svg
                            id="theme-icon-dark"
                            class="w-4 h-4 text-gray-500 hidden"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                            />
                        </svg>
                    </button>

                    <!-- Auto-scroll toggle -->
                    <button
                        id="autoscroll-toggle"
                        class="flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg border border-blue-300 dark:border-blue-600 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-colors"
                        title="Toggle auto-scroll"
                    >
                        <svg
                            class="w-4 h-4"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M19 14l-7 7m0 0l-7-7m7 7V3"
                            />
                        </svg>
                        <span class="text-xs font-medium">Auto</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Token filter bar -->
        <div
            id="token-filter-bar"
            class="hidden flex-none flex items-center gap-2 px-4 py-1.5 border-b border-gray-200 dark:border-gray-800 bg-amber-50 dark:bg-amber-950/30"
        >
            <svg class="w-3.5 h-3.5 text-amber-600 dark:text-amber-400 flex-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
            </svg>
            <span class="text-xs text-amber-700 dark:text-amber-300 font-medium flex-none">Correlating:</span>
            <div id="token-filter-tags" class="flex items-center gap-1.5 flex-wrap"></div>
            <button
                id="token-filter-clear"
                class="ml-auto text-xs text-amber-600 dark:text-amber-400 hover:text-amber-800 dark:hover:text-amber-200 font-medium flex-none"
            >Clear all</button>
        </div>

        <!-- Log container -->
        <div
            id="log-container"
            class="flex-1 overflow-y-auto bg-white dark:bg-gray-950 px-4"
        >
            <div id="log-viewport" style="position: relative"></div>
            <div
                id="empty-state"
                class="flex flex-col items-center justify-center h-full text-gray-400 dark:text-gray-600"
            >
                <svg
                    class="w-12 h-12 mb-3"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.5"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                    />
                </svg>
                <p class="text-sm font-medium">Waiting for logs...</p>
            </div>
        </div>

        <!-- Footer -->
        <footer
            class="flex-none border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-4 py-1.5"
        >
            <div
                class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400"
            >
                <span id="log-count">0 lines</span>
                <span class="font-mono" id="app-addr"></span>
            </div>
        </footer>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
